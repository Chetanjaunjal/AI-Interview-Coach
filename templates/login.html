<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Log In | AI Interview Coach</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="site-header"><a class="brand" href="{{ url_for('home') }}">AI Interview Coach</a><nav><a href="{{ url_for('register') }}">Register</a></nav></header><main><section class="auth-page"><p class="eyebrow">Welcome back</p><h1>Log <span>in.</span></h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="analysis-status {{ category }}" role="alert">{{ message }}</p>{% endfor %}{% endwith %}<form class="auth-form" method="post"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary-button" type="submit">Log In <span aria-hidden="true">&rarr;</span></button></form></section></main></body></html>
