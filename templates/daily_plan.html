<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Today's Plan | AI Interview Coach</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="site-header"><a class="brand" href="{{ url_for('home') }}">AI Interview Coach</a><nav><a href="{{ url_for('roadmap') }}">Roadmap</a><a href="{{ url_for('practice') }}">Practice</a></nav></header><main><section class="history-page"><p class="eyebrow">Daily Recommendation</p><h1>Today's <span>Preparation</span></h1><p class="upload-instructions">A focused {{ plan.minutes }}-minute session for {{ plan.topic }}.</p><div class="practice-grid">{% for minutes, task in plan.tasks %}<article class="practice-card"><p class="eyebrow">{{ minutes }} minutes</p><h2>{{ task }}</h2></article>{% endfor %}</div><p><a class="secondary-link" href="{{ url_for('roadmap_today', minutes=30) }}">30 min</a><a class="secondary-link" href="{{ url_for('roadmap_today', minutes=60) }}">60 min</a><a class="secondary-link" href="{{ url_for('roadmap_today', minutes=90) }}">90 min</a></p></section></main></body></html>
