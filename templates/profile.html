<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile | AI Interview Coach</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="site-header"><a class="brand" href="{{ url_for('home') }}">AI Interview Coach</a><nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('history') }}">History</a><form action="{{ url_for('logout') }}" method="post"><button class="text-button" type="submit">Log Out</button></form></nav></header><main><section class="history-page"><p class="eyebrow">Account</p><h1>Your <span>Profile</span></h1><div class="profile-card"><div><strong>Name</strong><span>{{ user.name }}</span></div><div><strong>Email</strong><span>{{ user.email }}</span></div><div><strong>Member since</strong><span>{{ user.created_at[:10] }}</span></div></div></section></main></body></html>
