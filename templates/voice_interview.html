<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Voice Interview | AI Interview Coach</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="site-header"><a class="brand" href="{{ url_for('home') }}">AI Interview Coach</a><nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('history') }}">History</a></nav></header><main><section class="auth-page"><p class="eyebrow">Voice Practice</p><h1>AI Voice <span>Interview</span></h1><p class="upload-instructions">Practice answering naturally using your voice. Your microphone is used only for voice input and audio is not stored.</p><form class="auth-form" action="{{ url_for('start_voice_interview') }}" method="post"><label for="voice-job">Target Role</label><select id="voice-job" name="job_id"><option value="">Current interview context</option>{% for job in jobs %}<option value="{{ job.id }}">{{ job.title }}</option>{% endfor %}</select><label for="voice-type">Interview Type</label><select id="voice-type" name="interview_type"><option value="technical">Technical</option><option value="behavioral">Behavioral</option><option value="hr">HR</option><option value="mixed">Mixed</option></select><label for="voice-difficulty">Difficulty</label><select id="voice-difficulty" name="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select><label for="voice-count">Number of Questions</label><select id="voice-count" name="number_of_questions"><option value="5" selected>5</option><option value="10">10</option><option value="15">15</option></select><button class="primary-button" type="submit">Start Voice Interview <span aria-hidden="true">&rarr;</span></button></form></section></main></body></html>
